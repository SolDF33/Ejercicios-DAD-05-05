version: '3.7'

services:
  # PHP
  php7:
    container_name: php7
    build: ./php
    volumes:
      - ../config/php:/usr/local/etc/php
      - ../code/myapp:/var/www/html/myapp
    depends_on:
      - mariadb
    networks:
      - lemp-network

  # NGINX
  nginx:
    container_name: nginx
    image: nginx
    ports:
      - 8080:80
    volumes:
      - ../config/nginx:/etc/nginx/conf.d
      - ../code/myapp:/var/www/html/myapp  
      - ../docker/nginx/logs:/var/log/nginx
    depends_on:
      - php7
    networks:
      - lemp-network

  # MARIADB
  mariadb:
    container_name: mariadb
    image: mariadb:latest
    volumes:
      - ../mariadb/data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=docker_sample
    ports:
      - 3306:3306
    networks:
      - lemp-network

  # PHPMYADMIN
# PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb  # <--- ESTA LÍNEA LE DICE QUE BUSQUE A 'mariadb' Y NO A 'db'
      PMA_PORT: 3306
    ports:
      - 8081:80
    networks:
      - lemp-network

networks:
  lemp-network:
    driver: bridge
